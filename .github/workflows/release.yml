name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Validate and package release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run quality gate
        run: composer check
      - name: Build installable ZIP
        run: bash scripts/build-zip.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: woocompat-auditor-package
          path: dist/*.zip
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --verify-tag \
            --generate-notes \
            --title "WooCompat Auditor ${GITHUB_REF_NAME#v}"
