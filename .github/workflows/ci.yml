name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  unit-tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit
        run: composer test

  quality:
    name: Coding standards and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Run WordPress coding standards
        run: composer lint
      - name: Verify synchronized version metadata
        run: composer verify-version

  package-smoke:
    name: Build installable plugin ZIP
    runs-on: ubuntu-latest
    needs: [unit-tests, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Build package
        run: bash scripts/build-zip.sh
      - name: Inspect package
        run: |
          ZIP_FILE="$(find dist -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          unzip -l "$ZIP_FILE" | grep 'woocompat-auditor/woocompat-auditor.php'
          unzip -l "$ZIP_FILE" | grep 'woocompat-auditor/readme.txt'
