name: Bug report
description: Report a reproducible problem in WooCompat Auditor
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve WooCompat Auditor. Please avoid posting secrets or customer data.
  - type: input
    id: version
    attributes:
      label: WooCompat Auditor version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: WordPress / WooCommerce / PHP versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
