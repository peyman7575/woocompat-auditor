name: Feature request
description: Propose a new audit check or workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What real WooCommerce maintenance or compatibility problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: false_positives
    attributes:
      label: False-positive considerations
      description: What legitimate site configurations could look like a problem to this check?
